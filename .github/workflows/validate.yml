name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SLOTH_VERSION: "v0.16.0"
  PROMETHEUS_VERSION: "3.7.3"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: Install sloth
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o /usr/local/bin/sloth \
            "https://github.com/slok/sloth/releases/download/${SLOTH_VERSION}/sloth-linux-amd64"
          chmod +x /usr/local/bin/sloth

      - name: Install promtool
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"

      - name: Lint, validate, generate, check rules and dashboard JSON
        run: ./scripts/check.sh

      - name: Fail if generated/ is stale
        run: |
          git add --intent-to-add generated
          git diff --exit-code -- generated

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start demo stack
        working-directory: demo
        run: docker compose up -d --build --wait

      - name: Verify dropdown, burn rates, and alert annotation
        run: python3 demo/verify.py

      - name: Show container logs on failure
        if: failure()
        working-directory: demo
        run: docker compose logs

      - name: Stop demo stack
        if: always()
        working-directory: demo
        run: docker compose down

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Links to this repo's own main branch are excluded: on a PR they point at
      # files that only exist after merge. Relative links cover the same files.
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-retries 3
            --exclude '^https://github\.com/ematobi1/prometheus-slo-manifests/(blob|tree)/'
            --exclude '^http://localhost'
            README.md docs
          fail: true
