name: hk-slo-demo

services:
  exporter:
    build: ./exporter
    environment:
      SERVICES: "reservations,licensing"
      REQUESTS_PER_SECOND: "50"
      ERROR_RATE: "0.0005"
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../generated:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hotel-key-slos/slo-overview.json
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/demo.yml:ro
      - ../dashboards/provisioning.yml:/etc/grafana/provisioning/dashboards/hotel-key-slos.yml:ro
      - ../dashboards:/var/lib/grafana/dashboards/hotel-key-slos:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
