version: "prometheus/v1"
service: "licensing-service"
labels:
  owner: "hotel-key"
  tier: "2"
slos:
  - name: "requests-availability"
    objective: 99.5
    description: "Share of licensing-service HTTP requests that do not fail with a 5xx response."
    sli:
      events:
        # TODO: confirm metric name
        error_query: sum(rate(http_requests_total{service="licensing",code=~"5.."}[{{.window}}]))
        # TODO: confirm metric name
        total_query: sum(rate(http_requests_total{service="licensing"}[{{.window}}]))
    alerting:
      name: LicensingServiceHighErrorRate
      labels:
        category: "availability"
      annotations:
        summary: "licensing-service is burning its availability error budget"
        dashboard: "https://github.com/ematobi1/prometheus-slo-manifests/blob/main/dashboards/slo-overview.json"
        runbook_url: "https://github.com/ematobi1/prometheus-slo-manifests/blob/main/docs/runbooks/licensing-service.md"
      page_alert:
        labels:
          severity: "critical"
      ticket_alert:
        labels:
          severity: "warning"
